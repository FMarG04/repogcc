services:
  workspace:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
    environment:
      LIBROS_DB_URL: jdbc:postgresql://postgres:5432/biblioteca
      LIBROS_DB_USER: libros
      LIBROS_DB_PASSWORD: libros_dev
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: libros
      POSTGRES_PASSWORD: libros_dev
    volumes:
      - libros-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "libros", "-d", "biblioteca"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  libros-pgdata:
