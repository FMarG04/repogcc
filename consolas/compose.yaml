services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: consolas
      POSTGRES_PASSWORD: consolas_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "consolas", "-d", "catalogo"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  datos:
