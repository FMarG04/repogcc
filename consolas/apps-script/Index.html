<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <base target="_top">
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #172b3a; background: #f4f7fa; }
    main { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    section { margin-top: 1.25rem; padding: 1rem; border: 1px solid #ccd7df; border-radius: .5rem; background: #fff; }
    h2 { margin: 0 0 .75rem; }
    fieldset { margin: 0; padding: 0; border: 0; }
    .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: .75rem; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input, button { font: inherit; padding: .4rem .65rem; border: 1px solid #8297a9; border-radius: .3rem; }
    input { min-width: 0; }
    button { background: #fff; color: inherit; cursor: pointer; }
    button[type="submit"] { background: #174d8e; color: #fff; border-color: #174d8e; }
    button:disabled { opacity: .65; cursor: wait; }
    .botones { margin-top: .75rem; }
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #dce4ea; overflow-wrap: anywhere; }
    td button { margin: .125rem .25rem .125rem 0; }
    #estado { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Consolas</h1>
    <section aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Registrar consola</h2>
      <form id="formulario">
        <fieldset id="campos">
          <div class="campos">
            <label>Marca <input name="marca" required maxlength="80"></label>
            <label>Modelo <input name="modelo" required maxlength="80"></label>
          </div>
          <div class="botones">
            <button id="guardar" type="submit">Registrar</button>
            <button id="cancelar" type="button" hidden>Cancelar</button>
          </div>
        </fieldset>
      </form>
      <p id="estado" role="status"></p>
    </section>
    <section aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Consolas registradas</h2>
      <div class="tabla">
        <table>
          <thead><tr><th scope="col">ID</th><th scope="col">Marca</th><th scope="col">Modelo</th><th scope="col">Acciones</th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const formulario = document.getElementById('formulario');
    const campos = document.getElementById('campos');
    const titulo = document.getElementById('titulo-formulario');
    const guardar = document.getElementById('guardar');
    const cancelar = document.getElementById('cancelar');
    const estado = document.getElementById('estado');
    const filas = document.getElementById('filas');
    const marca = formulario.elements.namedItem('marca');
    const modelo = formulario.elements.namedItem('modelo');
    let idEdicion = null;

    function llamar(accion, id = null, datos = null) {
      return new Promise((resolver, rechazar) => {
        google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar)
          .consolas(accion, id, datos);
      });
    }

    async function ejecutar(tarea) {
      if (campos.disabled) return;
      campos.disabled = true;
      filas.querySelectorAll('button').forEach(boton => { boton.disabled = true; });
      estado.textContent = 'Cargando…';
      try {
        estado.textContent = await tarea();
      } catch (error) {
        estado.textContent = error.message || 'Error al consultar la API.';
      } finally {
        campos.disabled = false;
        filas.querySelectorAll('button').forEach(boton => { boton.disabled = false; });
      }
    }

    function modoFormulario(consola = null) {
      idEdicion = consola?.id ?? null;
      marca.value = consola?.marca ?? '';
      modelo.value = consola?.modelo ?? '';
      titulo.textContent = consola ? 'Editar consola' : 'Registrar consola';
      guardar.textContent = consola ? 'Guardar cambios' : 'Registrar';
      cancelar.hidden = !consola;
    }

    async function listar() {
      const consolas = await llamar('listar');
      filas.replaceChildren();
      if (!consolas.length) {
        const celda = filas.insertRow().insertCell();
        celda.colSpan = 4;
        celda.textContent = 'Todavía no hay consolas.';
      }
      for (const consola of consolas) {
        const fila = filas.insertRow();
        for (const valor of [consola.id, consola.marca, consola.modelo]) {
          fila.insertCell().textContent = valor;
        }
        const acciones = fila.insertCell();
        acciones.append(
          boton('Editar', () => { modoFormulario(consola); marca.focus(); }),
          boton('Eliminar', () => eliminar(consola))
        );
      }
    }

    function boton(texto, accion) {
      const elemento = document.createElement('button');
      elemento.type = 'button';
      elemento.textContent = texto;
      elemento.addEventListener('click', accion);
      return elemento;
    }

    function eliminar(consola) {
      if (!confirm('¿Eliminar la consola ' + consola.marca + ' ' + consola.modelo + '?')) return;
      ejecutar(async () => {
        await llamar('eliminar', consola.id);
        if (idEdicion === consola.id) modoFormulario();
        await listar();
        return 'Consola eliminada.';
      });
    }

    formulario.addEventListener('submit', evento => {
      evento.preventDefault();
      const datos = { marca: marca.value.trim(), modelo: modelo.value.trim() };
      ejecutar(async () => {
        const accion = idEdicion === null ? 'crear' : 'editar';
        await llamar(accion, idEdicion, datos);
        modoFormulario();
        await listar();
        return accion === 'crear' ? 'Consola registrada.' : 'Cambios guardados.';
      });
    });
    cancelar.addEventListener('click', () => modoFormulario());
    ejecutar(async () => { await listar(); return ''; });
  </script>
</body>
</html>
