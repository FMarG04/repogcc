<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <style>
    body { margin: 0; background: #f6f8fb; color: #162338; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 54rem; margin: 2rem auto; padding: 0 1rem; }
    section { padding: 1rem; background: #fff; border: 1px solid #cbd5e1; border-radius: .5rem; }
    h2 { margin-top: 0; }
    .campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; }
    label { display: grid; gap: .25rem; font-weight: 600; }
    input, button { font: inherit; border: 1px solid #94a3b8; border-radius: .3rem; padding: .45rem .65rem; }
    input { min-width: 0; }
    button { cursor: pointer; color: inherit; background: #fff; }
    button[type="submit"] { background: #1746a2; border-color: #1746a2; color: #fff; }
    button:disabled { opacity: .6; cursor: wait; }
    .acciones { margin-top: .8rem; display: flex; flex-wrap: wrap; gap: .5rem; }
    .tabla { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #e2e8f0; }
    td button { margin: .15rem .25rem .15rem 0; }
    #estado { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Catálogo de consolas</h1>
    <section aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nueva consola</h2>
      <form id="formulario">
        <div class="campos">
          <label>Marca <input id="marca" required maxlength="80"></label>
          <label>Modelo <input id="modelo" required maxlength="80"></label>
          <label>Precio <input id="precio" required type="number" min="0" max="9999999999.99" step="0.01"></label>
        </div>
        <div class="acciones">
          <button id="guardar" type="submit">Agregar</button>
          <button id="cancelar" type="button" hidden>Cancelar edición</button>
        </div>
      </form>
    </section>
    <p id="estado" role="status" aria-live="polite"></p>
    <section aria-labelledby="titulo-listado">
      <h2 id="titulo-listado">Consolas registradas</h2>
      <div class="tabla">
        <table>
          <thead><tr><th scope="col">Marca</th><th scope="col">Modelo</th><th scope="col">Precio</th><th scope="col">Acciones</th></tr></thead>
          <tbody id="filas"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const formulario = document.getElementById('formulario');
    const tituloFormulario = document.getElementById('titulo-formulario');
    const marca = document.getElementById('marca');
    const modelo = document.getElementById('modelo');
    const precio = document.getElementById('precio');
    const guardar = document.getElementById('guardar');
    const cancelar = document.getElementById('cancelar');
    const estado = document.getElementById('estado');
    const filas = document.getElementById('filas');
    const formatoPrecio = new Intl.NumberFormat('es-PE', {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    });
    let editando = null;
    let ocupado = false;

    function invocar(accion, ...args) {
      return new Promise((resolver, rechazar) => {
        const servidor = google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar);
        servidor[accion](...args);
      });
    }

    async function ejecutar(tarea) {
      if (ocupado) return;
      ocupado = true;
      actualizarBotones();
      estado.textContent = 'Cargando…';
      try {
        estado.textContent = await tarea();
      } catch (error) {
        estado.textContent = error.message || 'Ocurrió un error al conectar con la API.';
      } finally {
        ocupado = false;
        actualizarBotones();
      }
    }

    function actualizarBotones() {
      for (const boton of document.querySelectorAll('button')) boton.disabled = ocupado;
    }

    async function cargar() {
      const consolas = await invocar('listarConsolas');
      filas.replaceChildren();
      if (!consolas.length) {
        const celda = filas.insertRow().insertCell();
        celda.colSpan = 4;
        celda.textContent = 'Todavía no hay consolas.';
      }
      for (const consola of consolas) {
        const fila = filas.insertRow();
        for (const valor of [consola.marca, consola.modelo, formatoPrecio.format(consola.precio)]) {
          fila.insertCell().textContent = valor;
        }
        const acciones = fila.insertCell();
        acciones.append(
          boton('Editar', () => comenzarEdicion(consola)),
          boton('Eliminar', () => eliminar(consola))
        );
      }
    }

    function boton(texto, alPulsar) {
      const elemento = document.createElement('button');
      elemento.type = 'button';
      elemento.textContent = texto;
      elemento.addEventListener('click', alPulsar);
      return elemento;
    }

    function comenzarEdicion(consola) {
      editando = consola.id;
      marca.value = consola.marca;
      modelo.value = consola.modelo;
      precio.value = consola.precio;
      tituloFormulario.textContent = 'Editar consola';
      guardar.textContent = 'Guardar cambios';
      cancelar.hidden = false;
      marca.focus();
    }

    function limpiarFormulario() {
      editando = null;
      formulario.reset();
      tituloFormulario.textContent = 'Nueva consola';
      guardar.textContent = 'Agregar';
      cancelar.hidden = true;
    }

    function eliminar(consola) {
      if (ocupado || !confirm('¿Eliminar ' + consola.marca + ' ' + consola.modelo + '?')) return;
      ejecutar(async () => {
        await invocar('eliminarConsola', consola.id);
        if (editando === consola.id) limpiarFormulario();
        await cargar();
        return 'Consola eliminada.';
      });
    }

    formulario.addEventListener('submit', (evento) => {
      evento.preventDefault();
      const datos = { marca: marca.value.trim(), modelo: modelo.value.trim(), precio: precio.valueAsNumber };
      if (!datos.marca || !datos.modelo || !Number.isFinite(datos.precio)) {
        estado.textContent = 'Completa la marca, el modelo y el precio.';
        return;
      }
      ejecutar(async () => {
        const id = editando;
        if (id === null) await invocar('crearConsola', datos);
        else await invocar('editarConsola', id, datos);
        limpiarFormulario();
        await cargar();
        return id === null ? 'Consola agregada.' : 'Cambios guardados.';
      });
    });
    cancelar.addEventListener('click', limpiarFormulario);
    ejecutar(async () => {
      await cargar();
      return '';
    });
  </script>
</body>
</html>
